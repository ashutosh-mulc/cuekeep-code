# Gate G1: premise census (research/experiment_design.md).
extends:
  - configs/base.yaml
  - configs/model/qwen3_vl_4b_thinking.yaml

tier: gate
requires_gates: [G0]

model:
  max_new_tokens: 16384     # smoke budget; if any sample truncates, rerun with model.max_new_tokens=40960

datasets:
  # The first 20 samples of each dataset's fixed dev split (nested inside every later gate's sample).
  - {name: mme, split: test, role: dev, dev_size: 150, limit: 20}
  # As run on 2026-11-15 (runs/E000-env-smoke/20261115-234047-gate): the original release on local disk,
  # with the bare instruction as the prompt (prompt: bare), so answers were explanations, not clicks.
  - name: screenspot_pro
    source_annotations: local
    annotations_dir: /group-volume/a.mulchandan/datasets/ScreenSpot-Pro/annotations
    images_dir: /group-volume/a.mulchandan/datasets/ScreenSpot-Pro/images
    hf_id: likaixin/ScreenSpot-Pro
    split: test
    role: dev
    dev_size: 150
    limit: 20
    bbox_format: xyxy
    bbox_units: pixels
    question_field: instruction
    bbox_field: bbox
    prompt: bare

gate:
  min_median_trace_tokens: 300        # on at least one dataset: traces are long enough for a decode-time method
  visual_dataset: screenspot_pro
  min_median_visual_frac: 0.50        # visual tokens / prompt tokens on the high-resolution dataset
