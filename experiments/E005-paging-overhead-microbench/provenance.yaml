experiment_id: "E005"
title: "Paging overhead microbenchmark"
description: "Times the per-decode-step cost of region scoring, fetch commit and attention-input assembly across all paged layers, with real model shapes and no dataset, relative to the full-KV decode step time from E000."
repro_lock: null
repro_lock_reason: "GPU experiment run outside ARS with model Qwen/Qwen3-VL-4B-Thinking; no ARS prompts to hash. Config, git SHA and environment are recorded per run in runs/E005-paging-overhead-microbench/<timestamp>/."
