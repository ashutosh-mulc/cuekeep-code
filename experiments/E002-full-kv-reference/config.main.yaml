  - experiments/E002-full-kv-reference/config.gate.yaml

tier: main
requires_gates: [G6]
seeds: [0, 1, 2]
benchmarks:
  - name: mathvista
    split: testmini
    role: all
    dev_size: 150
    full_size: 1000
    official: 79.5
  - name: screenspot_pro
    source_annotations: local
    annotations_dir: /group-volume/a.mulchandan/datasets/ScreenSpot-Pro/annotations
    images_dir: /group-volume/a.mulchandan/datasets/ScreenSpot-Pro/images
    prompt: gui_click
    role: all
    dev_size: 150
    full_size: 1581
    official: 49.2
gate: null
