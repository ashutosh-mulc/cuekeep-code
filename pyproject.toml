[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuekeep"
version = "0.1.0"
description = "Pooled-KV paging for visual tokens in thinking VLMs"
readme = "README.md"
requires-python = ">=3.10"          # server: Python 3.12.3, torch 2.15.0+cu132, transformers 5.23.0 (checked 2026-11-15)
dependencies = [
  "pyyaml>=6",
  "numpy>=1.26",
]

[project.optional-dependencies]
# torch is installed by scripts/setup_server.sh from the CUDA wheel index; for CPU-only tests: pip install torch
gpu = [
  "transformers>=5.4,<6",           # tested with 5.23.0
  "accelerate>=1.0",
  "safetensors",
  "pillow",
]
eval = [
  "datasets>=3",
  "pillow",
  "pandas",
  "wandb",
]
dev = [
  "pytest>=8",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA device (run on the server)",
  "integration: runs the model-facing code on a tiny random Qwen3-VL (needs transformers + processor files)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["legacy"]  # kept verbatim from the earlier direction; see legacy/vlm2_gate0/README.md
